[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag-platform"
version = "0.5.0"
description = "Production-oriented enterprise RAG and agentic AI reference platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "qdrant-client>=1.11,<2",
  "sentence-transformers>=6.0.1,<7",
  "transformers>=5.16.1,<6",
  "rank-bm25>=0.2.2,<1",
  "pypdf>=6.17.0,<7",
  "prometheus-client>=0.20,<1",
  "asyncpg>=0.30,<1",
  "redis>=6,<8",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "PyJWT[crypto]>=2.10,<3",
  "boto3>=1.40,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
  "pip-audit>=2.7,<3"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
