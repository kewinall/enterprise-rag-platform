name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts
      - run: pytest -q
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate Helm chart
        run: |
          helm lint charts/enterprise-rag
          helm template ci charts/enterprise-rag >/tmp/enterprise-rag-rendered.yaml
      - name: Validate Keycloak realm JSON
        run: python -m json.tool keycloak/realm-export.json >/dev/null
      - name: Validate offline shell scripts
        run: bash -n scripts/offline/*.sh
