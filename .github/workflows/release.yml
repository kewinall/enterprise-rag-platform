name: Release

on:
  push:
    branches: ["main"]
    paths:
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts
      - run: pytest -q
      - name: Run adversarial regression suite
        run: python scripts/evaluate_adversarial.py >/tmp/adversarial.json
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Validate Helm chart
        run: |
          helm lint charts/enterprise-rag
          helm template release charts/enterprise-rag >/tmp/enterprise-rag-rendered.yaml
      - name: Validate JSON artifacts
        run: |
          python -m json.tool keycloak/realm-export.json >/dev/null
          python -m json.tool observability/grafana-agent-dashboard.json >/dev/null
      - name: Validate offline shell scripts
        run: bash -n scripts/offline/*.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip "setuptools>=83" pip-audit
          pip install .
          pip-audit --skip-editable
      - name: Trivy filesystem scan
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            aquasec/trivy:0.74.0 \
            fs \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --no-progress \
            /workspace

  release:
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -v "^$TAG$" | head -n 1 || true)"
          TITLE="Enterprise RAG Platform $TAG"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [[ -n "$PREVIOUS_TAG" ]]; then
              gh release create "$TAG" \
                --verify-tag \
                --title "$TITLE" \
                --generate-notes \
                --notes-start-tag "$PREVIOUS_TAG"
            else
              gh release create "$TAG" \
                --verify-tag \
                --title "$TITLE" \
                --generate-notes
            fi
          else
            if [[ -n "$PREVIOUS_TAG" ]]; then
              gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --title "$TITLE" \
                --generate-notes \
                --notes-start-tag "$PREVIOUS_TAG"
            else
              gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --title "$TITLE" \
                --generate-notes
            fi
          fi
