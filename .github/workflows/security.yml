name: Security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip "setuptools>=83" pip-audit
      - name: Install CPU-only PyTorch for audit
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
      - run: pip install .
      - run: pip-audit --skip-editable

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        run: |
          docker run --rm             -v "$PWD:/workspace"             aquasec/trivy:0.74.0             fs             --exit-code 1             --severity CRITICAL,HIGH             --no-progress             /workspace
