apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enterprise-rag-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: enterprise-secret-store
    kind: ClusterSecretStore
  target:
    name: enterprise-rag-secrets
    creationPolicy: Owner
  data:
    - secretKey: LLM_API_KEY
      remoteRef:
        key: enterprise-rag/llm-api-key
    - secretKey: POSTGRES_DSN
      remoteRef:
        key: enterprise-rag/postgres-dsn
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: enterprise-rag/s3-access-key-id
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: enterprise-rag/s3-secret-access-key
