services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    volumes:
      - ./data:/app/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama:0.5.7
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  qdrant-data:
  ollama-data:
